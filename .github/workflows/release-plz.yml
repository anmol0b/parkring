name: Release

# Opt-in: does nothing until the repository variable RELEASE_PLZ is "true".
# Also needed: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests", and a CARGO_REGISTRY_TOKEN secret to publish.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Publishes any version in Cargo.toml that is not on crates.io yet, then tags
  # it and creates the GitHub release. Does nothing until the maintainer adds
  # the CARGO_REGISTRY_TOKEN secret.
  release:
    name: publish unreleased versions
    if: github.repository == 'anmol0b/parkring' && vars.RELEASE_PLZ == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: skip without a crates.io token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set; nothing is published"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: stable
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens or updates the release pull request.
  release-pr:
    name: release pull request
    if: github.repository == 'anmol0b/parkring' && vars.RELEASE_PLZ == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
