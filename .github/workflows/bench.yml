name: Benchmarks

# Manual only: shared runners are too noisy to gate merges on performance.
on: workflow_dispatch

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - run: cargo bench -p parkring-bench --bench throughput
      - run: cargo bench -p parkring-bench --bench latency
      - run: cargo run -p parkring-bench --release --example plot > bench-tables.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmarks
          path: |
            target/criterion
            target/latency
            assets/*.svg
            bench-tables.md
