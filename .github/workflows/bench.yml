name: Benchmarks

# Manual only: shared runners are too noisy to gate merges on performance.
on: workflow_dispatch

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - run: cargo bench -p parkring-bench --bench throughput
      - run: cargo bench -p parkring-bench --bench latency
      - run: cargo run -p parkring-bench --release --example plot > bench-tables.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: |
            target/criterion
            target/latency
            assets/*.svg
            bench-tables.md
