name: Benchmarks

# Manual only: shared runners are too noisy to gate merges on performance.
on: workflow_dispatch

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo bench -p parkring-bench --bench throughput
      - run: cargo bench -p parkring-bench --bench latency
      - run: cargo run -p parkring-bench --release --example plot > bench-tables.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: |
            target/criterion
            target/latency
            assets/*.svg
            bench-tables.md
