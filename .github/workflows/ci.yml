name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, sync-shim guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: portable fallback compiles (FreeBSD uses Mutex + Condvar parking)
        run: |
          rustup target add x86_64-unknown-freebsd
          cargo check -p parkring --lib --target x86_64-unknown-freebsd
      - name: std sync primitives only via src/sync/primitives.rs
        run: |
          if grep -rnE 'std::(sync::(atomic|Mutex|Condvar|MutexGuard|Arc)|cell::UnsafeCell)' src \
               --include='*.rs' | grep -v '^src/sync/primitives.rs:'; then
            echo "::error::use crate::sync so loom can model every primitive"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - name: examples
        shell: bash
        run: |
          for example in pipeline quicksort scheduler shutdown; do
            cargo run -p parkring --release --example "$example"
          done
      - name: parked threads use no CPU
        if: runner.os != 'Windows'
        run: cargo test -p parkring --release --test cpu_burn -- --ignored --nocapture
        # Shared CI runners are noisy; keep this informational.
        continue-on-error: true

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.85"
      - run: cargo check -p parkring --lib

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps -p parkring

  public-api:
    name: public API matches public-api.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustdoc's JSON output changes between nightlies; pin the one the
      # snapshot was made with and bump both together.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-01-04
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-public-api@0.52.0
      - name: diff against the committed snapshot
        run: |
          RUSTUP_TOOLCHAIN=nightly-2026-01-04 cargo public-api -p parkring --omit blanket-impls > public-api.txt
          git diff --exit-code public-api.txt || {
            echo "::error::the public API changed; if intended, regenerate public-api.txt (see CONTRIBUTING.md)"
            exit 1
          }

  loom:
    name: loom (${{ matrix.parker }} parker)
    strategy:
      fail-fast: false
      matrix:
        include:
          - parker: futex
            cfg: --cfg loom
          - parker: condvar
            cfg: --cfg loom --cfg parkring_force_condvar
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ${{ matrix.cfg }} -D warnings
      LOOM_MAX_PREEMPTIONS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: loom-${{ matrix.parker }}
      - run: cargo test -p parkring --release --test loom --test loom_scq --test loom_pool --test loom_channel
      - run: cargo test -p parkring --release --lib deque

  loom-mutants:
    name: loom catches ${{ matrix.mutant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mutant: scq_conditional_threshold
            test: --test loom_scq fifo_across_laps
          - mutant: deque_no_pop_fence
            test: --lib deque::loom_tests::pop_racing_two_steals_never_double_takes
          - mutant: deque_no_steal_fence
            test: --lib deque::loom_tests::pop_racing_two_steals_never_double_takes
          - mutant: channel_no_disconnect
            test: --test loom_channel receiver_wakes_when_the_last_sender_drops
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom --cfg parkring_mutant="${{ matrix.mutant }}"
      LOOM_MAX_PREEMPTIONS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: loom-mutant-${{ matrix.mutant }}
      - name: the deliberately broken build must fail
        run: |
          if cargo test -p parkring --release ${{ matrix.test }}; then
            echo "::error::loom no longer detects ${{ matrix.mutant }}"
            exit 1
          fi

  miri:
    name: Miri (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stacked borrows
            flags: ""
            rustflags: ""
          - name: tree borrows
            flags: -Zmiri-tree-borrows
            rustflags: ""
          # The portable parker (Windows, FreeBSD) is otherwise only loom-checked.
          - name: condvar parker
            flags: ""
            rustflags: --cfg parkring_force_condvar
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check ${{ matrix.flags }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - run: cargo miri setup
      - run: >
          cargo miri test -p parkring --lib --test drop_semantics --test send_sync
          --test regressions --test linearizability --test proptest_model --test deque --test pool
          --test channel

  miri-seeds:
    name: Miri (many schedules)
    runs-on: ubuntu-latest
    env:
      # Each seed is a different thread schedule and weak-memory outcome.
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-many-seeds=0..16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - run: cargo miri setup
      # Two invocations: a name filter applies to every test binary given.
      - run: cargo miri test -p parkring --test channel
      - run: cargo miri test -p parkring --test sequential_and_concurrent lockfree

  tsan:
    name: ThreadSanitizer (${{ matrix.parker }} parker)
    strategy:
      fail-fast: false
      matrix:
        include:
          - parker: futex
            cfg: ""
          - parker: condvar
            cfg: --cfg parkring_force_condvar
    runs-on: ubuntu-latest
    # TSan does not model standalone fences, so the Chase-Lev deque's
    # fence(SeqCst) pairs (and the pool built on it) are left to loom and Miri.
    # Informational until it has a clean history.
    continue-on-error: true
    env:
      RUSTFLAGS: -Zsanitizer=thread ${{ matrix.cfg }}
      RUSTDOCFLAGS: -Zsanitizer=thread
      TSAN_OPTIONS: halt_on_error=1
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
          components: rust-src
      - run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p parkring
          --test channel --test sequential_and_concurrent --test regressions
          --test linearizability --test drop_semantics

  test-32bit:
    name: test (i686 Linux, 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p parkring --target i686-unknown-linux-gnu --all-targets

  test-arm-linux:
    name: test (AArch64 Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p parkring --all-targets
      - run: cargo test -p parkring --doc

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  semver:
    name: semver against the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: parkring

  fuzz-smoke:
    name: fuzz ${{ matrix.target }} (1 min)
    strategy:
      fail-fast: false
      matrix:
        target: [queue, deque, channel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-fuzz
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

  bench-smoke:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo bench -p parkring-bench --no-run
      - run: cargo build -p parkring-bench --release --example plot
