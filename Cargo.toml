[workspace]
members = [".", "crates/parkring-bench"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/anmol0b/parkring"

[workspace.dependencies]
parkring = { path = ".", version = "1.0.0" }
libc = "0.2"
loom = "0.7"
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }
crossbeam-queue = "0.3"
crossbeam-deque = "0.8"
rayon = "1"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series", "errorbar"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(loom)",
    "cfg(docsrs)",
    "cfg(parkring_force_condvar)",
    # Deliberately broken builds for mutation testing; see tests/loom_scq.rs.
    'cfg(parkring_mutant, values("scq_conditional_threshold", "deque_no_pop_fence", "deque_no_steal_fence", "channel_no_disconnect"))',
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
missing_panics_doc = "allow"
cast_possible_wrap = "allow"
comparison_chain = "allow"  # keeps the three-way diff shaped like Vyukov's original
doc_markdown = "allow"

[profile.bench]
lto = "fat"
codegen-units = 1
debug = 1

[profile.release]
debug = 1

[package]
name = "parkring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded MPMC channels and queues (Vyukov and SCQ), a Chase-Lev work-stealing deque and a work-stealing thread pool, with futex-based parking. Checked with loom, Miri and fuzzing."
readme = "README.md"
keywords = ["mpmc", "channel", "queue", "lock-free", "work-stealing"]
categories = ["concurrency", "data-structures"]
exclude = ["assets/", "docs/", ".github/", "crates/", "video/", "fuzz/", "deny.toml", "public-api.txt", "release-plz.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]

# Futex-based parking. Other targets use std's Mutex + Condvar.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
libc.workspace = true

# Only compiled under `RUSTFLAGS="--cfg loom"`; never part of a downstream build.
[target.'cfg(loom)'.dependencies]
loom.workspace = true

[features]
default = ["std"]
# Required for now; see the crate docs. Reserved so that a future `no_std`
# mode only adds support and breaks nobody.
std = []
# Test-only constructors used by this crate's own integration tests. Not
# public API and not covered by semver.
__test-hooks = []

[dev-dependencies]
# Turns on the test hooks for this crate's integration tests only.
parkring = { path = ".", features = ["__test-hooks"] }
libc.workspace = true
proptest.workspace = true
